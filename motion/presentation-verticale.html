<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genshin Tracker — Motion vertical</title>
<style>
:root{--bg:#05080f;--gold:#e7bf7c;--mint:#7ed7bd;--text:#edf2f7;--muted:#8d9bb0;
  --serif:Georgia,'Times New Roman',serif;--mono:Menlo,'SF Mono',monospace;--sans:'Avenir Next',Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:#000;height:100%;overflow:hidden}
/* 1080×1920 stage, scaled to fit the window */
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--text);font-family:var(--sans)}
canvas{position:absolute;inset:0}
.l{position:absolute;left:0;right:0;text-align:center;will-change:transform,opacity}
.mono{font-family:var(--mono);letter-spacing:.32em;text-transform:uppercase;font-size:26px;color:var(--mint)}
.title{font-family:var(--serif);font-weight:500;line-height:1.02;letter-spacing:-.02em}
.gold{color:var(--gold)}
.glow{text-shadow:0 0 24px rgba(231,191,124,.55),0 0 80px rgba(231,191,124,.25)}
.rgb{text-shadow:-4px 0 rgba(255,60,120,.7),4px 0 rgba(60,220,255,.7)}
.chip{display:inline-flex;align-items:center;gap:22px;padding:30px 44px;border:2px solid rgba(126,215,189,.5);border-radius:20px;
  background:rgba(18,28,46,.75);font-size:40px;box-shadow:0 0 60px rgba(126,215,189,.18) inset,0 0 40px rgba(126,215,189,.15)}
.chip i{width:20px;height:20px;border-radius:50%;background:var(--mint);box-shadow:0 0 20px var(--mint)}
.card{position:absolute;left:90px;right:90px;height:168px;display:flex;align-items:center;gap:34px;padding:0 40px;border-radius:22px;
  background:linear-gradient(100deg,rgba(25,37,58,.92),rgba(12,20,34,.75));border:1.5px solid rgba(231,191,124,.28);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--gold),var(--mint))}
.card .ix{font-family:var(--mono);font-size:24px;color:var(--mint);width:60px}
.card h3{font-family:var(--serif);font-weight:500;font-size:52px}
.card p{font-size:28px;color:var(--muted);margin-top:6px}
.card .sh{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%)}
.node{position:absolute;left:170px;right:170px;height:230px;border-radius:26px;border:2px solid rgba(126,215,189,.45);
  background:rgba(14,22,38,.85);display:flex;flex-direction:column;justify-content:center;padding:0 50px;box-shadow:0 0 50px rgba(126,215,189,.12)}
.node .k{font-family:var(--mono);font-size:24px;letter-spacing:.3em;color:var(--gold)}
.node strong{font-family:var(--serif);font-weight:500;font-size:64px;margin:8px 0 4px}
.node small{font-size:30px;color:var(--muted)}
.stat{position:absolute;left:0;right:0;text-align:center}
.stat .n{font-family:var(--serif);font-size:300px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat .t{font-size:38px;color:var(--muted);margin-top:4px}
.url{display:inline-block;padding:34px 60px;border-radius:18px;background:var(--gold);color:#05080f;font-weight:700;font-size:46px;
  box-shadow:0 0 80px rgba(231,191,124,.45)}
.hud{position:absolute;font-family:var(--mono);font-size:20px;letter-spacing:.2em;color:rgba(126,215,189,.7)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="dom"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
</div>
<script>
/* Timeline déterministe : tout l'écran est une fonction de t (secondes).
   window.seek(t) dessine l'image t ; en navigateur, la boucle rAF joue la vidéo. */
const DUR = 24;
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const dom = document.getElementById('dom');
const add = (h) => dom.appendChild($(h));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 4);                 // easeOutQuart
const easeIO = (x) => (x = clamp(x), x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2);
const p = (t, a, d) => clamp((t - a) / d);                           // progress 0..1 of [a, a+d]
const win = (t, a, b, f = .35) => Math.min(ease(p(t, a, f)), 1 - easeIO(p(t, b - f, f))); // in at a, out at b
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const GLYPHS = '01<>/\\#%$&@*+=ABCDEFGHJKLMNPQRSTUVWXYZ';
function decode(str, prog, seed) {       // texte qui se « décrypte » de gauche à droite
  const n = Math.floor(str.length * prog);
  let s = '';
  for (let i = 0; i < str.length; i++) {
    if (i < n || str[i] === ' ') s += str[i];
    else if (i < n + 6) s += GLYPHS[Math.floor(rnd(i * 13 + seed + Math.floor(prog * 40)) * GLYPHS.length)];
  }
  return s;
}
function set(el, o, y = 0, s = 1, extra = '') {
  el.style.opacity = o;
  el.style.transform = `translate3d(0,${y}px,0) scale(${s}) ${extra}`;
  el.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
}

/* ---------- éléments ---------- */
const hudTL = add('<div class="hud" style="left:60px;top:70px">GT//SYS 2.6</div>');
const hudTR = add('<div class="hud" style="right:60px;top:70px;text-align:right"></div>');
const hudBL = add('<div class="hud" style="left:60px;bottom:70px">GENSHIN-TRACKER.COM</div>');
const hudBR = add('<div class="hud" style="right:60px;bottom:70px"></div>');

// S1 boot / logo
const s1boot = add('<div class="l mono" style="top:300px"></div>');
const s1t1 = add('<div class="l title glow" style="top:1230px;font-size:150px">Genshin</div>');
const s1t2 = add('<div class="l title gold glow" style="top:1380px;font-size:150px">Tracker</div>');
const s1sub = add('<div class="l" style="top:1580px;font-size:38px;color:var(--muted)">Ton carnet de progression Genshin Impact</div>');

// S2 question
const s2tag = add('<div class="l mono" style="top:520px">// requête du jour</div>');
const s2q = add('<div class="l title" style="top:640px;font-size:150px;padding:0 70px"></div>');
const s2a = add('<div class="l" style="top:1260px"><span class="chip"><i></i><span>Personnage ciblé · <b class="gold">ordre concret</b></span></span></div>');

// S3 modules
const s3tag = add('<div class="l mono" style="top:250px">// un seul carnet</div>');
const s3h = add('<div class="l title" style="top:320px;font-size:92px">Tout, <span class="gold">au même endroit</span></div>');
const MODS = [['Personnages', 'Niveaux, talents, constellations'], ['Inventaire', 'Armes, artéfacts, matériaux'], ['Progression', 'Ce qui manque, quoi farmer'],
  ['Équipes', 'Composer et simuler avec gcsim'], ['Collection', 'Le catalogue face à ton compte'], ['Synchronisation', 'Ton PC relié, chaque relevé suivi']];
const cards = MODS.map(([h, d], i) => add(`<div class="card" style="top:${560 + i * 200}px"><span class="ix">0${i + 1}</span><div><h3>${h}</h3><p>${d}</p></div><div class="sh"></div></div>`));

// S4 flux
const s4tag = add('<div class="l mono" style="top:250px">// le parcours</div>');
const s4h = add('<div class="l title" style="top:320px;font-size:92px">Du jeu au carnet,<br><span class="gold">en un scan</span></div>');
const NODES = [['ÉTAPE 01', 'Kamera FR', 'Scanner Windows, jeu en français'], ['ÉTAPE 02', 'Relevé GOOD', 'Un fichier .json'], ['ÉTAPE 03', 'Ton carnet', 'Consultable partout']];
const NODE_Y = [620, 1010, 1400];
const nodes = NODES.map(([k, s, m], i) => add(`<div class="node" style="top:${NODE_Y[i]}px"><span class="k">${k}</span><strong>${s}</strong><small>${m}</small></div>`));

// S5 chiffres
const STATS = [[6, 'modules dans le carnet'], [1, 'fichier GOOD pour démarrer'], [0, 'donnée envoyée sans ton accord']];
const stats = STATS.map(([, txt], i) => add(`<div class="stat" style="top:${300 + i * 500}px"><div class="n">0</div><div class="t">${txt}</div></div>`));

// S6 outro
const s6h = add('<div class="l title glow" style="top:1080px;font-size:110px">Quoi farmer<br><span class="gold">aujourd’hui ?</span></div>');
const s6u = add('<div class="l" style="top:1420px"><span class="url">genshin-tracker.com</span></div>');
const s6f = add('<div class="l" style="top:1600px;font-size:28px;color:var(--muted)">© 2026 Lux Audere</div>');

/* ---------- canvas ---------- */
const bg = document.getElementById('bg').getContext('2d');
const fx = document.getElementById('fx').getContext('2d');
const W = 1080, H = 1920;
const STAR = [[24, 7], [28.7, 19.3], [41, 24], [28.7, 28.7], [24, 41], [19.3, 28.7], [7, 24], [19.3, 19.3]];
const PARTS = Array.from({ length: 140 }, (_, i) => ({ x: rnd(i) * W, y: rnd(i + 500) * H, z: .3 + rnd(i + 900) * .7, s: rnd(i + 1300) }));

function drawBg(t) {
  bg.clearRect(0, 0, W, H);
  // halos
  const g1 = bg.createRadialGradient(W * .2, H * (.3 + .05 * Math.sin(t * .4)), 0, W * .2, H * .3, 900);
  g1.addColorStop(0, 'rgba(231,191,124,.16)'); g1.addColorStop(1, 'transparent');
  bg.fillStyle = g1; bg.fillRect(0, 0, W, H);
  const g2 = bg.createRadialGradient(W * .85, H * .75, 0, W * .85, H * .75, 900);
  g2.addColorStop(0, 'rgba(126,215,189,.12)'); g2.addColorStop(1, 'transparent');
  bg.fillStyle = g2; bg.fillRect(0, 0, W, H);

  // sol en grille perspective (horizon à 62 %), défile vers la caméra
  const hz = H * .62, on = ease(p(t, .2, 1.2));
  bg.save(); bg.globalAlpha = .55 * on; bg.strokeStyle = 'rgba(126,215,189,.5)'; bg.lineWidth = 1.5;
  for (let i = -14; i <= 14; i++) { bg.beginPath(); bg.moveTo(W / 2 + i * 22, hz); bg.lineTo(W / 2 + i * 260, H + 40); bg.stroke(); }
  const off = (t * .6) % 1;
  for (let k = 0; k < 14; k++) {
    const z = (k + 1 - off) / 14, y = hz + (H - hz) * z * z;
    bg.globalAlpha = .55 * on * z; bg.beginPath(); bg.moveTo(0, y); bg.lineTo(W, y); bg.stroke();
  }
  const fade = bg.createLinearGradient(0, hz - 10, 0, hz + 260);
  fade.addColorStop(0, 'rgba(5,8,15,1)'); fade.addColorStop(1, 'rgba(5,8,15,0)');
  bg.globalAlpha = 1; bg.fillStyle = fade; bg.fillRect(0, hz - 10, W, 270);
  bg.restore();

  // particules qui montent
  for (const q of PARTS) {
    const y = ((q.y - t * 60 * q.z) % H + H) % H, a = .15 + .5 * q.z * (.5 + .5 * Math.sin(t * 2 + q.s * 9));
    bg.fillStyle = q.s > .7 ? `rgba(231,191,124,${a})` : `rgba(126,215,189,${a * .8})`;
    bg.fillRect(q.x + Math.sin(t + q.s * 6) * 10, y, 2.5 * q.z, 2.5 * q.z);
  }
}

function ring(cx, cy, r, a0, a1, w, col) { fx.beginPath(); fx.arc(cx, cy, r, a0, a1); fx.lineWidth = w; fx.strokeStyle = col; fx.stroke(); }
function star(cx, cy, size, rot, prog, fill) {
  fx.save(); fx.translate(cx, cy); fx.rotate(rot); fx.scale(size / 48, size / 48); fx.translate(-24, -24);
  fx.beginPath(); STAR.forEach(([x, y], i) => i ? fx.lineTo(x, y) : fx.moveTo(x, y)); fx.closePath();
  fx.setLineDash([120 * prog, 200]); fx.lineWidth = 1; fx.strokeStyle = '#e7bf7c'; fx.shadowColor = '#e7bf7c'; fx.shadowBlur = 20; fx.stroke();
  if (fill > 0) { fx.globalAlpha = fill; fx.fillStyle = '#e7bf7c'; fx.fill(); fx.globalAlpha = 1; fx.fillStyle = '#05080f';
    fx.beginPath(); fx.arc(24, 24, 3.2, 0, 7); fx.fill(); }
  fx.restore();
}

function drawFx(t) {
  fx.clearRect(0, 0, W, H);
  // S1 : anneaux holographiques + étoile
  const a1 = win(t, 0, 4.2, .5);
  if (a1 > 0) {
    const cx = W / 2, cy = 820, d = ease(p(t, .3, 1.4));
    fx.globalAlpha = a1;
    ring(cx, cy, 250, -Math.PI / 2 + t * .6, -Math.PI / 2 + t * .6 + Math.PI * 2 * d, 3, 'rgba(126,215,189,.8)');
    ring(cx, cy, 300, -t * .9, -t * .9 + Math.PI * 1.3 * d, 2, 'rgba(231,191,124,.6)');
    for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2 + t * .2, r0 = 340, r1 = i % 4 ? 352 : 372;
      fx.globalAlpha = a1 * d * .7; fx.beginPath(); fx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      fx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); fx.lineWidth = 2; fx.strokeStyle = '#7ed7bd'; fx.stroke(); }
    fx.globalAlpha = a1;
    star(cx, cy, 360 * (.6 + .4 * ease(p(t, .8, 1.2))), (1 - ease(p(t, .8, 1.4))) * -1.2, ease(p(t, .6, 1.2)), ease(p(t, 1.6, .6)));
    fx.globalAlpha = 1;
  }
  // S4 : liens verticaux + paquets de données
  const a4 = win(t, 12.4, 16.8);
  if (a4 > 0) for (let i = 0; i < 2; i++) {
    const y0 = NODE_Y[i] + 230, y1 = NODE_Y[i + 1], grow = ease(p(t, 13.2 + i * .7, .5));
    fx.globalAlpha = a4; fx.strokeStyle = 'rgba(126,215,189,.4)'; fx.lineWidth = 3; fx.setLineDash([]);
    fx.beginPath(); fx.moveTo(W / 2, y0); fx.lineTo(W / 2, y0 + (y1 - y0) * grow); fx.stroke();
    if (grow >= 1) for (let k = 0; k < 3; k++) {
      const u = ((t * 1.1 + k / 3 + i * .5) % 1), y = y0 + (y1 - y0) * u;
      fx.fillStyle = '#7ed7bd'; fx.shadowColor = '#7ed7bd'; fx.shadowBlur = 24;
      fx.fillRect(W / 2 - 8, y - 14, 16, 28); fx.shadowBlur = 0;
    }
    fx.globalAlpha = 1;
  }
  // Transitions : barre de scan + bruit numérique aux coupes
  for (const c of [4.0, 8.0, 12.4, 16.8, 20.2]) {
    const u = (t - c + .3) / .6;
    if (u > 0 && u < 1) {
      const y = H * u;
      const g = fx.createLinearGradient(0, y - 160, 0, y + 10);
      g.addColorStop(0, 'transparent'); g.addColorStop(1, 'rgba(126,215,189,.45)');
      fx.fillStyle = g; fx.fillRect(0, y - 160, W, 170);
      fx.fillStyle = 'rgba(237,242,247,.9)'; fx.fillRect(0, y, W, 3);
      for (let k = 0; k < 14; k++) { const r = rnd(k + c * 100 + Math.floor(t * 30));
        fx.fillStyle = r > .5 ? 'rgba(231,191,124,.35)' : 'rgba(126,215,189,.3)';
        fx.fillRect(rnd(k * 3 + c) * W, y - 300 + r * 600, 80 + r * 400, 4 + r * 18); }
    }
  }
  // lignes de balayage + vignette
  fx.fillStyle = 'rgba(0,0,0,.18)'; for (let y = 0; y < H; y += 4) fx.fillRect(0, y, W, 1);
  const v = fx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'transparent'); v.addColorStop(1, 'rgba(0,0,0,.7)'); fx.fillStyle = v; fx.fillRect(0, 0, W, H);
  // coins HUD
  fx.strokeStyle = 'rgba(126,215,189,.6)'; fx.lineWidth = 3; const m = 40, L = 70 * ease(p(t, 0, .8));
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    fx.beginPath(); fx.moveTo(x + sx * L, y); fx.lineTo(x, y); fx.lineTo(x, y + sy * L); fx.stroke(); }
}

/* ---------- DOM ---------- */
const BOOT = ['> init carnet', '> sync relevé GOOD', '> système en ligne'];
const Q = 'Quoi farmer aujourd’hui ?';
function drawDom(t) {
  hudTR.textContent = 'T+' + t.toFixed(2).padStart(5, '0');
  hudBR.textContent = String(Math.floor(t / DUR * 100)).padStart(3, '0') + '%';
  const hud = ease(p(t, .3, .8)); [hudTL, hudTR, hudBL, hudBR].forEach((e) => (e.style.opacity = hud * .9));

  // S1
  const a1 = win(t, 0, 4.2, .5);
  const bl = Math.min(3, Math.floor(p(t, .1, 1.5) * 3.99));
  s1boot.innerHTML = BOOT.slice(0, bl).map((l, i) => i === bl - 1 ? decode(l, p(t, .1 + i * .5, .45), i) : l).join('<br>');
  set(s1boot, a1 * (1 - ease(p(t, 2.2, .5))), 0);
  const g = (t > 1.7 && t < 2.1 && Math.floor(t * 30) % 2) ? 'rgb' : '';
  s1t1.className = 'l title glow ' + g; s1t2.className = 'l title gold glow ' + g;
  s1t1.textContent = decode('Genshin', p(t, 1.5, .6), 1); s1t2.textContent = decode('Tracker', p(t, 1.7, .6), 2);
  set(s1t1, a1 * ease(p(t, 1.5, .4)), 60 * (1 - ease(p(t, 1.5, .8))));
  set(s1t2, a1 * ease(p(t, 1.7, .4)), 60 * (1 - ease(p(t, 1.7, .8))));
  set(s1sub, a1 * ease(p(t, 2.4, .6)), 30 * (1 - ease(p(t, 2.4, .8))));

  // S2
  const a2 = win(t, 4.0, 8.0);
  set(s2tag, a2, 0);
  s2q.textContent = decode(Q, p(t, 4.3, 1.6), 7);
  s2q.className = 'l title ' + (t > 5.9 && t < 6.15 ? 'rgb' : '');
  set(s2q, a2, 0, 1 + .04 * (1 - ease(p(t, 4.3, 1.8))));
  set(s2a, a2 * ease(p(t, 6.1, .5)), 50 * (1 - ease(p(t, 6.1, .7))), .9 + .1 * ease(p(t, 6.1, .7)));

  // S3
  const a3 = win(t, 8.0, 12.4);
  set(s3tag, a3, 0); set(s3h, a3 * ease(p(t, 8.2, .5)), 40 * (1 - ease(p(t, 8.2, .7))));
  cards.forEach((c, i) => {
    const k = p(t, 8.6 + i * .22, .7), x = (i % 2 ? 1 : -1) * 900 * (1 - ease(k));
    set(c, a3 * ease(k), 0, 1, `translateX(${x}px)`);
    c.lastChild.style.transform = `translateX(${(p(t, 9.4 + i * .22, .8) * 2.4 - 1.2) * 100}%)`;
  });

  // S4
  const a4 = win(t, 12.4, 16.8);
  set(s4tag, a4, 0); set(s4h, a4 * ease(p(t, 12.6, .5)), 40 * (1 - ease(p(t, 12.6, .7))));
  nodes.forEach((n, i) => { const k = p(t, 12.9 + i * .7, .6); set(n, a4 * ease(k), 0, .85 + .15 * ease(k)); });

  // S5
  const a5 = win(t, 16.8, 20.2);
  stats.forEach((s, i) => {
    const k = p(t, 17.0 + i * .45, .9);
    s.firstChild.textContent = Math.round(STATS[i][0] * ease(k)) || (k < 1 && STATS[i][0] ? Math.floor(rnd(t * 30 + i) * 10) : 0);
    set(s, a5 * ease(k), 80 * (1 - ease(k)));
  });

  // S6
  const a6 = ease(p(t, 20.2, .6)) * (1 - ease(p(t, DUR - .5, .5)));
  set(s6h, a6, 40 * (1 - ease(p(t, 20.2, .8))));
  set(s6u, a6 * ease(p(t, 20.8, .5)), 0, .8 + .2 * ease(p(t, 20.8, .6)) + .02 * Math.sin(t * 4) * ease(p(t, 21.5, .5)));
  set(s6f, a6 * ease(p(t, 21.2, .5)), 0);
}

function drawOutroStar(t) {   // étoile de fin, au-dessus du titre
  const a = ease(p(t, 20.2, .6)) * (1 - ease(p(t, DUR - .5, .5)));
  if (a <= 0) return;
  fx.globalAlpha = a;
  ring(W / 2, 800, 190, t * .8, t * .8 + 4.5, 2, 'rgba(126,215,189,.7)');
  ring(W / 2, 800, 225, -t, -t + 2.6, 2, 'rgba(231,191,124,.5)');
  star(W / 2, 800, 260, Math.sin(t) * .05, 1, ease(p(t, 20.4, .6)));
  fx.globalAlpha = 1;
}

window.seek = (t) => { drawBg(t); drawFx(t); drawOutroStar(t); drawDom(t); };
window.DUR = DUR;

/* mise à l'échelle + lecture en boucle (désactivée pour le rendu vidéo : ?render) */
const stage = document.getElementById('stage');
const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = `scale(${s}) translate(-50%,-50%)`; };
addEventListener('resize', fit); fit();
if (location.search.includes('render')) { stage.style.transform = 'none'; stage.style.left = stage.style.top = '0'; }
else {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) seek(21.5);
  else { const t0 = performance.now(); const loop = (n) => { seek(((n - t0) / 1000) % DUR); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
}
</script>
</body>
</html>
