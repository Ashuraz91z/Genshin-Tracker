name: Build and release Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  # The newest push wins: an older build still running is cancelled, so it cannot overwrite the draft afterwards.
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Next dependencies
        working-directory: web
        run: npm ci
      - name: Build Next site
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Test site and Next production server
        working-directory: web
        run: npm test
      - name: Verify the rotation simulation engine
        working-directory: web
        run: npm run test:engine
      - name: Build and test Windows package
        env:
          PYTHON: python
        shell: bash
        run: bash scripts/build_windows.sh
      - name: Package server
        run: python scripts/package_server.py
      - name: Preserve packages
        uses: actions/upload-artifact@v4
        with:
          name: genshin-tracker-packages
          path: dist/*.zip*
      - name: Publish test build as a private draft
        # Every push to main builds a draft, visible only to the repository's collaborators.
        # A version goes public only when someone publishes the draft (gh release edit vX --draft=false --latest).
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content web/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $short = $env:GITHUB_SHA.Substring(0,7)
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match "\.(zip|sha256)$" } | ForEach-Object { $_.FullName })
          $notes = "Version de test (brouillon privé) construite depuis $short. Extraire tout le paquet Windows. Les tests automatisés ne remplacent pas un essai réel dans Genshin."
          $draft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "Genshin Tracker $version" --notes $notes
          } elseif ($draft -eq "true") {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -eq 0) { gh release edit $tag --target $env:GITHUB_SHA --notes $notes }
          } else {
            Write-Host "Release $tag is already public; bump web/package.json for a new test build."
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
